version: "3.8"

services:
  vpsmon:
    build: .
    image: vpsmon:latest
    container_name: vpsmon
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - vpsmon-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - VPSMON_HOST=0.0.0.0
      - VPSMON_PORT=9090
      - VPSMON_DATA_DIR=/data
    mem_limit: 256m
    cpus: 0.5

volumes:
  vpsmon-data:
